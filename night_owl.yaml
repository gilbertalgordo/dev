        .icon-module:hover {
            border-color: var(--owl-cyan);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.4), inset 0 0 15px rgba(0, 229, 255, 0.2);
            transform: translateY(-5px);
        }

        /* SVG Base Styling */
        .icon-svg {
            width: 60%;
            height: 60%;
            fill: none;
            stroke: var(--owl-white);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.3s ease;
        }

        .icon-module:hover .icon-svg {
            stroke: var(--owl-cyan);
            filter: drop-shadow(0 0 5px var(--owl-cyan));
        }

        /* Hovering Context Tooltip (Street View & Weather Simulator) */
        .hover-tooltip {
            position: absolute;
            bottom: 120%;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            width: 220px;
            background: rgba(5, 8, 12, 0.95);
            border: 1px solid var(--owl-cyan);
            border-radius: 6px;
            padding: 10px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s ease-out;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            z-index: 100;
        }

        .icon-module:hover .hover-tooltip {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .tooltip-title {
            font-size: 0.8rem;
            color: var(--owl-cyan);
            border-bottom: 1px dashed rgba(0,229,255,0.4);
            margin-bottom: 6px;
            padding-bottom: 4px;
            text-transform: uppercase;
            font-weight: bold;
        }

        /* Simulated SV/Weather Image Box inside Tooltip */
        .tooltip-preview {
            width: 100%;
            height: 90px;
            background: #111;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tooltip-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.7;
        }

        .data-readout {
            font-size: 0.65rem;
            margin-top: 6px;
            color: #aaa;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }
        
        .data-readout span { color: var(--owl-white); }
    </style>
</head>
