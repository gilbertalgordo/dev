<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active White Night Owl AI - Tactical Map HUD</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-dark: #0a0c10;
            --owl-white: #f0f4f8;
            --owl-glow: #00d2ff;
            --owl-accent: #7000ff;
            --hud-panel: rgba(13, 17, 23, 0.85);
            --hud-border: rgba(0, 210, 255, 0.3);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            color: var(--owl-white);
        }

        /* Tactical HUD Container */
        #hud-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
            background-color: #05070a;
        }

        /* Top AI Search Control Panel */
        #ai-search-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: var(--hud-panel);
            border: 1px solid var(--hud-border);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
            padding: 10px 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 320px;
            backdrop-filter: blur(5px);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        #search-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(240, 244, 248, 0.4);
            padding: 8px 10px;
            color: var(--owl-white);
            font-family: inherit;
            border-radius: 4px;
            outline: none;
        }

        #search-input:focus {
            border-color: var(--owl-glow);
            box-shadow: 0 0 5px var(--owl-glow);
        }

        /* Autocorrect / Suggestion Box */
        #autocorrect-box {
            position: absolute;
            top: 105%;
            left: 0;
            width: 100%;
            background: var(--hud-panel);
            border: 1px solid var(--owl-glow);
            border-radius: 4px;
            display: none;
            flex-direction: column;
            max-height: 150px;
            overflow-y: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .suggestion-item {
            padding: 8px 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.85rem;
        }

        .suggestion-item:hover {
            background: var(--owl-accent);
            color: #fff;
        }

        .ai-status {
            font-size: 0.7rem;
            color: var(--owl-glow);
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
        }

        /* Hover Overlay Component (Street View & Weather Combined Display) */
        #hover-hud-overlay {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            width: 280px;
            background: var(--hud-panel);
            border: 1px solid var(--hud-border);
            border-radius: 6px;
            padding: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            pointer-events: none; /* Let clicks pass through to map if needed */
            display: none;
            backdrop-filter: blur(8px);
            transition: opacity 0.2s ease-in-out;
        }

        #hover-hud-overlay h3 {
            margin: 0 0 8px 0;
            font-size: 0.95rem;
            color: var(--owl-glow);
            border-bottom: 1px dashed rgba(0, 210, 255, 0.4);
            padding-bottom: 4px;
        }

        /* Mimic Street View window aspect ratio */
        .streetview-preview {
            width: 100%;
            height: 130px;
            background: #151c24;
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 10px;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .streetview-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.75;
        }

        .streetview-tag {
            position: absolute;
            top: 5px;
            left: 5px;
            background: rgba(0, 0, 0, 0.7);
            color: #ffb700;
            font-size: 0.6rem;
            padding: 2px 5px;
            border-radius: 3px;
            border: 1px solid #ffb700;
        }

        .weather-metrics {
            font-size: 0.75rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .metric-box {
            background: rgba(255,255,255,0.03);
            padding: 4px 6px;
            border-radius: 3px;
            border-left: 2px solid var(--owl-glow);
        }

        .metric-val {
            font-weight: bold;
            color: #fff;
        }

        /* Custom Layer Control to fit theme */
        .leaflet-control-layers {
            background: var(--hud-panel) !important;
            color: var(--owl-white) !important;
            border: 1px solid var(--hud-border) !important;
            font-family: inherit !important;
        }
    </style>
</head>
<body>

    <div id="hud-container">
        <!-- AI Input Panel with Autocorrect functionality -->
        <div id="ai-search-panel">
            <div class="ai-status">
                <span>SYSTEM: ACTIVE WHITE OWL AI</span>
                <span style="color: #ff3366;">● ENGINE LIVE</span>
            </div>
            <div class="input-wrapper">
                <input type="text" id="search-input" placeholder="Query destination..." autocomplete="off">
                <div id="autocorrect-box"></div>
            </div>
        </div>

        <!-- Map Workspace -->
        <div id="map"></div>

        <!-- Contextual Hover HUD (Street View / Micro Weather Metrics) -->
        <div id="hover-hud-overlay">
            <h3 id="hud-location-title">Tactical Node</h3>
            <div class="streetview-preview" id="hud-sv-viewport">
                <div class="streetview-tag">360° SV STREAM</div>
                <img id="hud-sv-img" src="" alt="Street View Stream">
            </div>
            <div class="weather-metrics">
                <div class="metric-box">TEMP: <span class="metric-val" id="hud-w-temp">--</span></div>
                <div class="metric-box">WIND: <span class="metric-val" id="hud-w-wind">--</span></div>
                <div class="metric-box">PRECIP: <span class="metric-val" id="hud-w-precip">--</span></div>
                <div class="metric-box">BARO: <span class="metric-val" id="hud-w-baro">--</span></div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS Core library -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- 1. Global Tactical Mock Database ---
        const locationDatabase = [
            { name: "Manila, Philippines", lat: 14.5995, lng: 120.9842, temp: "31°C", wind: "14 km/h", precip: "40%", baro: "1008 hPa", sv: "https://images.unsplash.com/photo-1540959733332-eab4deceeaf7?auto=format&fit=crop&w=400&q=80" },
            { name: "Tokyo, Japan", lat: 35.6762, lng: 139.6503, temp: "22°C", wind: "18 km/h", precip: "10%", baro: "1012 hPa", sv: "https://images.unsplash.com/photo-1503899036084-c55cdd92da26?auto=format&fit=crop&w=400&q=80" },
            { name: "New York, USA", lat: 40.7128, lng: -74.0060, temp: "19°C", wind: "22 km/h", precip: "0%", baro: "1015 hPa", sv: "https://images.unsplash.com/photo-1496442226666-8d4d0e62e6e9?auto=format&fit=crop&w=400&q=80" },
            { name: "London, UK", lat: 51.5074, lng: -0.1278, temp: "15°C", wind: "25 km/h", precip: "85%", baro: "998 hPa", sv: "https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?auto=format&fit=crop&w=400&q=80" },
            { name: "Paris, France", lat: 48.8566, lng: 2.3522, temp: "17°C", wind: "12 km/h", precip: "20%", baro: "1011 hPa", sv: "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=400&q=80" },
            { name: "San Pedro, Laguna", lat: 14.3505, lng: 121.0440, temp: "30°C", wind: "11 km/h", precip: "65%", baro: "1007 hPa", sv: "https://images.unsplash.com/photo-1583212292454-1fe6229603b7?auto=format&fit=crop&w=400&q=80" }
        ];

        // --- 2. Initialize Leaflet Map in Dark Matrix Aesthetics ---
        const map = L.map('map', {
            center: [14.5995, 120.9842],
            zoom: 5,
            zoomControl: false
        });

        // OpenStreetMap Dark Matter styling variant
        const darkCartoDB = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap contributors © CartoDB'
        }).addTo(map);

        // OpenWeatherMap Real-time Precipitation layer simulation overlay
        const weatherOverlay = L.tileLayer('https://tile.openweathermap.org/map/precipitation_new/{z}/{x}/{y}.png?appid=d226a3a4b64b1979b4d06a4a1599e525', {
            opacity: 0.5,
            attribution: 'Weather data © OpenWeatherMap'
        }).addTo(map);

        // Move controls to lower left out of HUD display components
        L.control.zoom({ position: 'bottomleft' }).addTo(map);

        // --- 3. Dynamic Interactive Hover Nodes Creation ---
        const markersGroup = L.layerGroup().addTo(map);

        locationDatabase.forEach(loc => {
            // Pulse style custom white/cyan icon configuration 
            const customIcon = L.divIcon({
                className: 'custom-hawk-eye',
                html: `<div style="
                    width: 12px; 
                    height: 12px; 
                    background: #fff; 
                    border: 2px solid var(--owl-glow); 
                    border-radius: 50%; 
                    box-shadow: 0 0 8px var(--owl-glow);"></div>`,
                iconSize: [12, 12],
                iconAnchor: [6, 6]
            });

            const marker = L.marker([loc.lat, loc.lng], { icon: customIcon }).addTo(markersGroup);

            // Trigger HUD Panel on Mouse Enter 
            marker.on('mouseover', function(e) {
                document.getElementById('hud-location-title').innerText = loc.name;
                document.getElementById('hud-sv-img').src = loc.sv;
                document.getElementById('hud-w-temp').innerText = loc.temp;
                document.getElementById('hud-w-wind').innerText = loc.wind;
                document.getElementById('hud-w-precip').innerText = loc.precip;
                document.getElementById('hud-w-baro').innerText = loc.baro;

                const panel = document.getElementById('hover-hud-overlay');
                panel.style.display = 'block';
                panel.style.opacity = '1';
            });

            // Fade/Hide HUD element when leaving marker focus bounding box
            marker.on('mouseout', function() {
                const panel = document.getElementById('hover-hud-overlay');
                panel.style.opacity = '0';
                setTimeout(() => { if(panel.style.opacity === '0') panel.style.display = 'none'; }, 200);
            });

            marker.on('click', function() {
                map.setView([loc.lat, loc.lng], 11, { animate: true });
            });
        });

        // --- 4. Intelligent Input Parser / Fuzzy Match Autocorrect System ---
        const searchInput = document.getElementById('search-input');
        const autocorrectBox = document.getElementById('autocorrect-box');

        // Basic Levenshtein distance calculations for AI auto-correction
        function getLevenshteinDistance(str1, str2) {
            const track = Array(str2.length + 1).fill(null).map(() => Array(str1.length + 1).fill(null));
            for (let i = 0; i <= str1.length; i += 1) track[0][i] = i;
            for (let j = 0; j <= str2.length; j += 1) track[j][0] = j;
            for (let j = 1; j <= str2.length; j += 1) {
                for (let i = 1; i <= str1.length; i += 1) {
                    const indicator = str1[i - 1] === str2[j - 1] ? 0 : 1;
                    track[j][i] = Math.min(
                        track[j][0 - 1][i] + 1, // deletion
                        track[j][i - 1] + 1, // insertion
                        track[j - 1][i - 1] + indicator // substitution
                    );
                }
            }
            return track[str2.length][str1.length];
        }

        searchInput.addEventListener('input', function() {
            const query = this.value.trim().toLowerCase();
            autocorrectBox.innerHTML = '';
            
            if (!query) {
                autocorrectBox.style.display = 'none';
                return;
            }

            // Filter data entries via partial string match or distance proximity
            const matches = locationDatabase.filter(loc => {
                const target = loc.name.toLowerCase();
                const distance = getLevenshteinDistance(query, target.substring(0, query.length));
                return target.includes(query) || distance <= 2;
            });

            if (matches.length > 0) {
                autocorrectBox.style.display = 'flex';
                matches.forEach(match => {
                    const item = document.createElement('div');
                    item.className = 'suggestion-item';
                    item.innerText = match.name;
                    item.addEventListener('click', () => {
                        searchInput.value = match.name;
                        autocorrectBox.style.display = 'none';
                        // Fly matrix window directly to point
                        map.flyTo([match.lat, match.lng], 10, { duration: 1.5 });
                    });
                    autocorrectBox.appendChild(item);
                });
            } else {
                autocorrectBox.style.display = 'none';
            }
        });

        // Dismiss element if container pointer leaves focal context area
        document.addEventListener('click', function(e) {
            if (!document.getElementById('ai-search-panel').contains(e.target)) {
                autocorrectBox.style.display = 'none';
            }
        });
    </script>
</body>
</html>



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active White Night Owl AI - Advanced HUD Command</title>
    <!-- Open Source Leaflet Mapping Framework -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-matrix: #06080c;
            --owl-white: #f5f8fc;
            --owl-glow: #00e5ff;
            --owl-dim-glow: rgba(0, 229, 255, 0.2);
            --owl-accent: #651fff;
            --hud-glass: rgba(10, 14, 22, 0.85);
            --hud-border: rgba(0, 240, 255, 0.25);
            --hud-font: 'Consolas', 'Courier New', monospace;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-matrix);
            font-family: var(--hud-font);
            overflow: hidden;
            color: var(--owl-white);
        }

        #hud-workspace {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #map-viewport {
            width: 100%;
            height: 100%;
            background-color: #030508;
        }

        /* --- Global Glassmorphic HUD Overlays --- */
        .glass-panel {
            background: var(--hud-glass);
            border: 1px solid var(--hud-border);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 4px;
            position: absolute;
            z-index: 1000;
            transition: all 0.3s cubic-bezier(0.19, 1, 0.22, 1);
        }

        /* Top Centered Autocorrect Search Control */
        #search-terminal {
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 420px;
            padding: 12px 16px;
        }

        .terminal-header {
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: var(--owl-glow);
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .terminal-header span::before {
            content: "● ";
            color: #ff1744;
            animation: pulse-beacon 1.5s infinite;
        }

        .input-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        #ai-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(0, 229, 255, 0.3);
            padding: 10px 14px;
            color: var(--owl-white);
            font-family: var(--hud-font);
            font-size: 0.9rem;
            border-radius: 3px;
            outline: none;
            transition: border 0.3s;
        }

        #ai-input:focus {
            border-color: var(--owl-glow);
            box-shadow: 0 0 8px var(--owl-dim-glow);
        }

        /* Predictive AI Autocorrect Interface */
        #autocorrect-dropdown {
            position: absolute;
            top: 105%;
            left: 0;
            width: 100%;
            background: rgba(8, 12, 18, 0.95);
            border: 1px solid var(--owl-glow);
            border-radius: 3px;
            display: none;
            flex-direction: column;
            max-height: 220px;
            overflow-y: auto;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
        }

        .autocorr-item {
            padding: 10px 14px;
            cursor: pointer;
            font-size: 0.85rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
        }

        .autocorr-item:hover {
            background: var(--owl-accent);
            color: #fff;
        }

        .autocorr-correction {
            color: var(--owl-glow);
            font-size: 0.75rem;
            font-style: italic;
        }

        /* Floating Street View & Weather HUD Element */
        #hover-node-hud {
            bottom: 30px;
            right: 30px;
            width: 320px;
            padding: 16px;
            pointer-events: none;
            opacity: 0;
            transform: translateY(10px);
            display: none;
        }

        #hover-node-hud.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .hud-title {
            margin: 0 0 10px 0;
            font-size: 1rem;
            color: #fff;
            text-transform: uppercase;
            border-bottom: 1px solid var(--hud-border);
            padding-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        /* Immersive Synthetic Street View Module */
        .streetview-window {
            width: 100%;
            height: 160px;
            background: #0d1117;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
            border-radius: 3px;
            margin-bottom: 12px;
        }

        .streetview-window img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
            filter: contrast(1.1) brightness(0.9);
        }

        .hud-tag {
            position: absolute;
            background: rgba(0,0,0,0.75);
            border: 1px solid var(--owl-glow);
            font-size: 0.6rem;
            padding: 2px 6px;
            border-radius: 2px;
            color: var(--owl-glow);
        }

        .tag-tl { top: 6px; left: 6px; }
        .tag-tr { top: 6px; right: 6px; color: #ffb700; border-color: #ffb700; }

        /* Integrated Telemetry Matrix Grid */
        .weather-matrix-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 0.78rem;
        }

        .matrix-cell {
            background: rgba(255,255,255,0.02);
            padding: 6px 8px;
            border-radius: 2px;
            border-left: 2px solid var(--owl-glow);
        }

        .matrix-label {
            color: rgba(245, 248, 252, 0.5);
            display: block;
            margin-bottom: 2px;
            font-size: 0.65rem;
        }

        .matrix-value {
            font-weight: bold;
            color: #fff;
        }

        /* --- Custom UI Layer Component Leaflet Adjustments --- */
        .leaflet-control-attribution {
            background: rgba(0,0,0,0.5) !important;
            color: rgba(255,255,255,0.3) !important;
            font-family: var(--hud-font);
        }

        @keyframes pulse-beacon {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <div id="hud-workspace">
        <!-- Interactive AI Control Center -->
        <div id="search-terminal" class="glass-panel">
            <div class="terminal-header">
                <span>SYSTEM CORE: WHITE OWL V4</span>
                <div id="ai-status-msg">AWAITING CORRECTION...</div>
            </div>
            <div class="input-container">
                <input type="text" id="ai-input" placeholder="Type localized node coordinates/names..." autocomplete="off">
                <div id="autocorrect-dropdown"></div>
            </div>
        </div>

        <!-- Base Geo-spatial Engine mapping workspace -->
        <div id="map-viewport"></div>

        <!-- Telemetry Hover Interface Panel -->
        <div id="hover-node-hud" class="glass-panel">
            <h3 class="hud-title" id="hud-target-name">Target Node</h3>
            <div class="streetview-window">
                <div class="hud-tag tag-tl">STREET_VIEW_FEED // INTERACTIVE</div>
                <div class="hud-tag tag-tr" id="hud-sv-bearing">HD CAM 01</div>
                <img id="hud-sv-render" src="" alt="Live Telemetry View">
            </div>
            <div class="weather-matrix-grid">
                <div class="matrix-cell"><span class="matrix-label">THERMAL</span><span class="matrix-value" id="val-temp">--</span></div>
                <div class="matrix-cell"><span class="matrix-label">VELOCITY</span><span class="matrix-value" id="val-wind">--</span></div>
                <div class="matrix-cell"><span class="matrix-label">BAROMETRIC</span><span class="matrix-value" id="val-baro">--</span></div>
                <div class="matrix-cell"><span class="matrix-label">RADAR PRECIP</span><span class="matrix-value" id="val-precip">--</span></div>
            </div>
        </div>
    </div>

    <!-- Leaflet Infrastructure Engine dependencies -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- Geospatial Database Initialization ---
        const mapDatabase = [
            { id: "MNL", name: "Manila, Philippines", alias: ["manila", "manilla", "mnl", "maynila"], lat: 14.5995, lng: 120.9842, temp: "31°C", wind: "14 km/h NE", baro: "1009 hPa", precip: "45%", img: "https://images.unsplash.com/photo-1540959733332-eab4deceeaf7?auto=format&fit=crop&w=500&q=80" },
            { id: "SND", name: "San Pedro, Laguna", alias: ["san pedro", "sanpedro", "laguna", "spl"], lat: 14.3505, lng: 121.0440, temp: "30°C", wind: "11 km/h E", baro: "1008 hPa", precip: "60%", img: "https://images.unsplash.com/photo-1583212292454-1fe6229603b7?auto=format&fit=crop&w=500&q=80" },
            { id: "TYO", name: "Tokyo, Japan", alias: ["tokyo", "tokio", "tokyoo", "tyo"], lat: 35.6762, lng: 139.6503, temp: "21°C", wind: "19 km/h N", baro: "1013 hPa", precip: "0%", img: "https://images.unsplash.com/photo-1540959733332-eab4deceeaf7?auto=format&fit=crop&w=500&q=80" },
            { id: "NYC", name: "New York, USA", alias: ["new york", "ny", "nyc", "newyork", "manhattan"], lat: 40.7128, lng: -74.0060, temp: "18°C", wind: "24 km/h W", baro: "1016 hPa", precip: "5%", img: "https://images.unsplash.com/photo-1496442226666-8d4d0e62e6e9?auto=format&fit=crop&w=500&q=80" },
            { id: "LDN", name: "London, United Kingdom", alias: ["london", "lundun", "ldn", "lon"], lat: 51.5074, lng: -0.1278, temp: "14°C", wind: "28 km/h SW", baro: "996 hPa", precip: "90%", img: "https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?auto=format&fit=crop&w=500&q=80" }
        ];

        // --- Leaflet Canvas Map Instantiation ---
        const map = L.map('map-viewport', {
            center: [14.5995, 120.9842],
            zoom: 6,
            zoomControl: false
        });

        // Night Owl Matrix Base Vector Tile Layer
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap | White Owl AI System'
        }).addTo(map);

        // Advanced Live Meteorological Tile Layer Overlay
        const weatherRadarLayer = L.tileLayer('https://tile.openweathermap.org/map/precipitation_new/{z}/{x}/{y}.png?appid=d226a3a4b64b1979b4d06a4a1599e525', {
            opacity: 0.45,
            zIndex: 200
        }).addTo(map);

        const nodesLayer = L.layerGroup().addTo(map);

        // --- Generate Map Dynamic HUD Markers ---
        mapDatabase.forEach(node => {
            const owlIcon = L.divIcon({
                className: 'hud-marker-pulse',
                html: `<div style="position: relative; width: 14px; height: 14px;">
                        <div style="position: absolute; width: 14px; height: 14px; background: #fff; border: 2px solid var(--owl-glow); border-radius: 50%; z-index: 2;"></div>
                        <div style="position: absolute; width: 30px; height: 30px; background: var(--owl-dim-glow); border-radius: 50%; top: -8px; left: -8px; animation: pulse-beacon 2s infinite; z-index: 1;"></div>
                       </div>`,
                iconSize: [14, 14],
                iconAnchor: [7, 7]
            });

            const marker = L.marker([node.lat, node.lng], { icon: owlIcon }).addTo(nodesLayer);

            // Street View & Weather Interface Display Trigger
            marker.on('mouseover', (e) => activeNodeTelemetry(node));
            marker.on('mouseout', deactivateNodeTelemetry);
            marker.on('click', () => {
                map.flyTo([node.lat, node.lng], 12, { duration: 2 });
            });
        });

        // --- HUD Panel Telemetry Controllers ---
        const hudPanel = document.getElementById('hover-node-hud');
        
        function activeNodeTelemetry(node) {
            document.getElementById('hud-target-name').innerText = node.name;
            document.getElementById('hud-sv-render').src = node.img;
            document.getElementById('val-temp').innerText = node.temp;
            document.getElementById('val-wind').innerText = node.wind;
            document.getElementById('val-baro').innerText = node.baro;
            document.getElementById('val-precip').innerText = node.precip;
            
            // Randomize heading bearing stream metadata output 
            document.getElementById('hud-sv-bearing').innerText = `CAM BEARING: ${Math.floor(Math.random() * 360)}° N`;

            hudPanel.style.display = 'block';
            setTimeout(() => hudPanel.classList.add('active'), 10);
        }

        function deactivateNodeTelemetry() {
            hudPanel.classList.remove('active');
            setTimeout(() => {
                if(!hudPanel.classList.contains('active')) hudPanel.style.display = 'none';
            }, 300);
        }

        // --- Intelligently Integrated Autocorrect String Logic ---
        const inputField = document.getElementById('ai-input');
        const dropdown = document.getElementById('autocorrect-dropdown');
        const statusMsg = document.getElementById('ai-status-msg');

        // Advanced Levenshtein String Proximity Parser
        function computeStringDistance(s1, s2) {
            const costs = [];
            for (let i = 0; i <= s1.length; i++) {
                let lastValue = i;
                for (let j = 0; j <= s2.length; j++) {
                    if (i == 0) costs[j] = j;
                    else {
                        if (j > 0) {
                            let newValue = costs[j - 1];
                            if (s1.charAt(i - 1) != s2.charAt(j - 1))
                                newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                            costs[j - 1] = lastValue;
                            lastValue = newValue;
                        }
                    }
                }
                if (i > 0) costs[s2.length] = lastValue;
            }
            return costs[s2.length];
        }

        inputField.addEventListener('input', function() {
            const rawQuery = this.value.trim().toLowerCase();
            dropdown.innerHTML = '';

            if (!rawQuery) {
                dropdown.style.display = 'none';
                statusMsg.innerText = "AWAITING INTERACTIVE INPUT...";
                return;
            }

            let predictionMatches = [];

            mapDatabase.forEach(node => {
                // Evaluate matching queries across aliases and core properties
                let highMatchChance = false;
                let lowestDistance = 999;

                node.alias.forEach(alias => {
                    if (alias.includes(rawQuery)) highMatchChance = true;
                    let dist = computeStringDistance(rawQuery, alias.substring(0, rawQuery.length));
                    if (dist < lowestDistance) lowestDistance = dist;
                });

                if (highMatchChance || lowestDistance <= 2) {
                    predictionMatches.push({ node: node, distance: lowestDistance });
                }
            });

            // Sort matched array by operational algorithmic distance
            predictionMatches.sort((a, b) => a.distance - b.distance);

            if (predictionMatches.length > 0) {
                dropdown.style.display = 'flex';
                statusMsg.innerText = "AUTOCORRECT ANALYSIS LIVE";

                predictionMatches.forEach(match => {
                    const row = document.createElement('div');
                    row.className = 'autocorr-item';
                    
                    // Show auto-corrected text tag if there is typographical variation
                    const isExact = match.node.name.toLowerCase().includes(rawQuery);
                    const autoCorrectTag = isExact ? "" : `<span class="autocorr-correction">↳ AI Autocorrect</span>`;
                    
                    row.innerHTML = `<span>${match.node.name}</span> ${autoCorrectTag}`;
                    
                    row.addEventListener('click', () => {
                        inputField.value = match.node.name;
                        dropdown.style.display = 'none';
                        statusMsg.innerText = "NODE SYNCHRONIZED";
                        
                        // Center layout framework coordinates dynamically
                        map.flyTo([match.node.lat, match.node.lng], 13, {
                            animate: true,
                            duration: 2.5
                        });
                        activeNodeTelemetry(match.node);
                    });
                    dropdown.appendChild(row);
                });
            } else {
                dropdown.style.display = 'none';
                statusMsg.innerText = "NO MATCH FOUND";
            }
        });

        // Hide UI contextual list window elements when clicking outside panels
        document.addEventListener('click', function(e) {
            if (!document.getElementById('search-terminal').contains(e.target)) {
                dropdown.style.display = 'none';
            }
        });
    </script>
</body>
</html>



