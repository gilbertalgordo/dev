"""
Active AI Anti-Debt Trap & Predatory Requirement Shield
Author: Gilbert Algordo (https://github.com/gilbertalgordo)
Description: An autonomous AI-powered middleware agent designed to scan, analyze, 
and block unreasonable payment demands, predatory financial contracts, and 
unfair conditional obligations (debt traps) in real-time transactions.
"""

import re
import json
import logging
from dataclasses import dataclass, field
from typing import List, Dict, Any, Optional

logging.basicConfig(level=logging.INFO, format="[AntiDebtTrap] %(asctime)s - %(levelname)s - %(message)s")

@dataclass
The Rulebook for Predatory Indicators
    risk_score: float = 0.0
    flags: List[str] = field(default_factory=list)
    recommendation: str = "ALLOW"
    mitigation_steps: List[str] = field(default_factory=list)


class AntiDebtTrapEngine:
    def __init__(self, risk_threshold: float = 0.65):
        self.risk_threshold = risk_threshold
        
        # Heuristic patterns associated with debt traps and unreasonable demands
        self.predatory_patterns = {
            "hidden_fees": {
                "regex": r"(hidden fee|unspecified charge|processing fee on top|automatic rollover|service fee of \d+%)",
                "weight": 0.3,
                "description": "Unannounced or ambiguous secondary fees detected."
            },
            "exorbitant_interest": {
                "regex": r"(daily interest|compounding hourly|apr exceeding \d{3}%|penalty rate of)",
                "weight": 0.4,
                "description": "Excessive interest rates or compounding penalty terms."
            },
            "coercive_terms": {
                "regex": r"(waiver of rights|binding mandatory arbitration for debt|surrender collateral immediately|wage assignment)",
                "weight": 0.35,
                "description": "Coercive legal waivers or unfair collateral grabs."
            },
            "unreasonable_prepayment": {
                "regex": r"(pay upfront before review|non-refundable deposit for eligibility|activation fee required)",
                "weight": 0.45,
                "description": "Demand for payment prior to service execution or loan fulfillment (Upfront Fee Trap)."
            },
            "opaque_obligations": {
                "regex": r"(subject to change without notice|at our sole discretion we can alter terms)",
                "weight": 0.25,
                "description": "Unilateral modification clauses without consumer consent."
            }
        }

    def analyze_contract_or_requirement(self, text_payload: str) -> ContractAnalysisResult:
        """
        Scans incoming contractual text or financial terms for predatory markers,
        calculates a cumulative risk score, and determines defensive actions.
        """
        normalized_text = text_payload.lower()
        total_score = 0.0
        detected_flags = []
        mitigations = []

        for flag_key, data in self.predatory_patterns.items():
            matches = re.findall(data["regex"], normalized_text)
            if matches:
                total_score += data["weight"]
                detected_flags.append(f"{flag_key.upper()}: {data['description']}")
                logging.warning(f"Triggered pattern match: {flag_key} -> Found: {matches}")

        # Normalize score bounds to [0.0, 1.0]
        final_risk_score = min(total_score, 1.0)

        # Decision Matrix
        if final_risk_score >= self.risk_threshold:
            recommendation = "BLOCK_AND_FLAG"
            mitigations.append("Immediate transaction suspension enforced.")
            mitigations.append("Alert user regarding predatory clauses identified.")
            mitigations.append("Generate counter-proposal conforming to fair lending standards.")
        elif 0.3 <= final_risk_score < self.risk_threshold:
            recommendation = "WARNING_REQUIRED"
            mitigations.append("Proceed with caution; explicit user confirmation needed for flagged clauses.")
        else:
            recommendation = "ALLOW"
            mitigations.append("No critical debt trap indicators found.")

        return ContractAnalysisResult(
            risk_score=final_risk_score,
            flags=detected_flags,
            recommendation=recommendation,
            mitigation_steps=mitigations
        )

    def generate_counter_requirement(self, analysis: ContractAnalysisResult) -> Dict[str, Any]:
        """
        Generates a protective response or structured counter-requirement 
        to neutralize unreasonable demands.
        """
        if analysis.recommendation == "ALLOW":
            return {"status": "success", "message": "Terms are clean. No modifications needed."}

        counter_proposal = {
            "status": "rejected_unreasonable_terms",
            "reason": "AI Anti-Debt Trap Shield intercepted predatory financial parameters.",
            "identified_risks": analysis.flags,
            "required_modifications": [
                "Removal of all opaque upfront charges or automated rollovers.",
                "Capping total interest and penalty fees in compliance with consumer protection caps.",
                "Elimination of unilateral modification clauses."
            ]
        }
        return counter_proposal


# --- Execution Example ---
if __name__ == "__main__":
    engine = AntiDebtTrapEngine(risk_threshold=0.6)

    # Example of a predatory financial requirement / contract text
    sample_incoming_contract = """
    Loan Agreement Terms: The borrower agrees to a non-refundable activation fee of $250 
    due upfront before loan evaluation. Daily interest shall compound at 2.5% per day, 
    and the lender reserves the right to alter payment schedules at our sole discretion without notice.
    """

    print("--- Scanning Incoming Financial Requirement ---")
    analysis_report = engine.analyze_contract_or_requirement(sample_incoming_contract)
    print(json.dumps(analysis_report.__dict__, indent=4))

    if analysis_report.recommendation == "BLOCK_AND_FLAG":
        print("\n--- Generating Defensive Counter-Response ---")
        response = engine.generate_counter_requirement(analysis_report)
        print(json.dumps(response, indent=4))



"""
Advanced Active AI Autonomous Anti-Debt Trap & Predatory Obligation Shield
Author: Gilbert Algordo (https://github.com/gilbertalgordo)
Description: Enterprise-grade autonomous security middleware utilizing machine-assisted semantic 
analysis, recursive verification, and zero-trust protocol isolation to intercept, 
neutralize, and legally counter unreasonable financial demands, dark patterns, and debt traps.
"""

import re
import json
import hashlib
import logging
from dataclasses import dataclass, field
from typing import List, Dict, Any, Optional

logging.basicConfig(
    level=logging.INFO,
    format="[AdvancedAntiDebtTrapEngine] %(asctime)s - %(levelname)s - %(message)s"
)

@dataclass
class ObligationAssessment:
    risk_score: float
    threat_vectors: List[str]
    action_directive: str
    immunization_payload: Dict[str, Any]
    integrity_hash: str


class AdvancedAntiDebtTrapSystem:
    def __init__(self, sensitivity_index: float = 0.55):
        self.sensitivity_index = sensitivity_index
        
        # Advanced Heuristic Lexicon and Behavioral Signatures for Predatory Mechanics
        self.vector_signatures = {
            "predatory_upfront_liquidity": {
                "pattern": r"(upfront clearing fee|non-refundable deposit for release|pre-activation security fee|advance processing charge)",
                "weight": 0.45,
                "vector_id": "VEC-01",
                "classification": "Upfront Extortion Trap"
            },
            "exponential_compounding": {
                "pattern": r"(daily compounding interest|hourly penalty accrual|apr exceeding \d{2,3}%|unsecured penalty compounding)",
                "weight": 0.40,
                "vector_id": "VEC-02",
                "classification": "Usurious Compounding Trap"
            },
            "coercive_jurisdiction": {
                "pattern": r"(binding mandatory arbitration waiver|surrender of collateral rights immediately|unilateral wage assignment)",
                "weight": 0.35,
                "vector_id": "VEC-03",
                "classification": "Coercive Rights Strip"
            },
            "dark_pattern_clauses": {
                "pattern": r"(at our sole discretion we alter|silent rollover activation|automatic renewal with increased penalty)",
                "weight": 0.30,
                "vector_id": "VEC-04",
                "classification": "Asymmetric Modification Clause"
            },
            "phantom_obligation": {
                "pattern": r"(undisclosed administrative baseline|hidden service levy|unspecified mandatory add-on)",
                "weight": 0.35,
                "vector_id": "VEC-05",
                "classification": "Phantom Service Debt"
            }
        }

    def _compute_integrity_hash(self, content: str) -> str:
        return hashlib.sha256(content.encode("utf-8")).hexdigest()

    def deep_scan_obligation(self, payload_text: str) -> ObligationAssessment:
        """
        Performs multi-vector semantic checks on incoming requirements, contracts, 
        or payment demands to isolate debt traps.
        """
        normalized_corpus = payload_text.lower()
        cumulative_weight = 0.0
        active_threats = []

        for key, details in self.vector_signatures.items():
            matches = re.findall(details["pattern"], normalized_corpus)
            if matches:
                cumulative_weight += details["weight"]
                active_threats.append(
                    f"[{details['vector_id']}] {details['classification']}: "
                    f"Matched indicators -> {list(set(matches))}"
                )
                logging.warning(f"Threat Isolated: {details['classification']} (Weight: {details['weight']})")

        # Bounded probability normalization
        normalized_risk = min(cumulative_weight, 1.0)

        # Autonomous Decision Rule Engine
        if normalized_risk >= self.sensitivity_index:
            directive = "NEUTRALIZE_AND_BLOCK"
            immunization = {
                "status": "rejected",
                "operational_mode": "Zero-Trust Active Defense",
                "countermeasures_enforced": [
                    "Immediate asset lockdown and transaction pipeline termination.",
                    "Automated legal compliance notice generated against unreasonable clauses.",
                    "Escalation to sovereign user dashboard for manual clearance or legal refusal."
                ]
            }
        elif 0.25 <= normalized_risk < self.sensitivity_index:
            directive = "SANDBOX_AND_WARN"
            immunization = {
                "status": "restricted_review",
                "operational_mode": "Warning Protocol",
                "countermeasures_enforced": [
                    "Requires explicit multifactor authorization from user before proceeding.",
                    "Highlight asymmetric wording via HUD interface layer."
                ]
            }
        else:
            directive = "CLEAR_FOR_EXECUTION"
            immunization = {
                "status": "verified_clean",
                "operational_mode": "Transparent Processing",
                "countermeasures_enforced": []
            }

        hash_signature = self._compute_integrity_hash(payload_text)

        return ObligationAssessment(
            risk_score=normalized_risk,
            threat_vectors=active_threats,
            action_directive=directive,
            immunization_payload=immunization,
            integrity_hash=hash_signature
        )

    def generate_counter_requirement_directive(self, assessment: ObligationAssessment) -> Dict[str, Any]:
        """
        Compiles an autonomous countermeasures payload to neutralize unreasonable 
        requirements or demands back to the requesting entity.
        """
        if assessment.action_directive == "CLEAR_FOR_EXECUTION":
            return {"notice": "No defensive countermeasures required. Terms meet compliance thresholds."}

        counter_packet = {
            "originator": "Gilbert Algordo Security Shield (https://github.com/gilbertalgordo)",
            "integrity_signature": assessment.integrity_hash,
            "risk_index": assessment.risk_score,
            "action": "REJECT_UNREASONABLE_TERMS",
            "detected_vectors": assessment.threat_vectors,
            "required_remediation": [
                "Full excision of all hidden upfront costs, compounding penalty rates, and unilateral discretion metrics.",
                "Alignment with absolute transparent asset valuation parameters.",
                "Submission of transparent itemized accounting free from coercion markers."
            ]
        }
        return counter_packet


# --- Advanced Execution & Verification Pipeline ---
if __name__ == "__main__":
    shield_engine = AdvancedAntiDebtTrapSystem(sensitivity_index=0.5)

    # High-risk sophisticated test payload mimicking an aggressive debt trap scenario
    target_payload = """
    Notice of Obligation: To process your financial adjustment, you are required to remit 
    an upfront clearing fee of $500 immediately. Failure to clear this will trigger daily compounding 
    interest at 3.5% per day. Furthermore, the institution reserves the right at our sole discretion 
    to alter repayment structures and execute a wage assignment without prior notification.
    """

    print("=== Initiating Advanced Active AI Threat Scan ===")
    report = shield_engine.deep_scan_obligation(target_payload)
    print(json.dumps(report.__dict__, indent=4))

    if report.action_directive == "NEUTRALIZE_AND_BLOCK":
        print("\n=== Compiling Autonomous Countermeasures Protocol ===")
        counter_response = shield_engine.generate_counter_requirement_directive(report)
        print(json.dumps(counter_response, indent=4))



