import React, { useRef } from 'react';
import { Canvas, useFrame } from '@react-three/fiber';
import * as THREE from 'three';

function ActiveAiFaceMesh() {
  const meshRef = useRef<THREE.Mesh>(null!);

  useFrame(({ clock }) => {
    // Pulse and rotate the tracking wireframe mesh
    const time = clock.getElapsedTime();
    if (meshRef.current) {
      meshRef.current.rotation.y = Math.sin(time * 0.5) * 0.15;
      (meshRef.current.material as THREE.MeshBasicMaterial).opacity = 0.6 + Math.sin(time * 3) * 0.2;
    }
  });

  return (
    <mesh ref={meshRef}>
      <sphereGeometry args={[1.5, 32, 32]} />
      <meshBasicMaterial wireframe color="#06b6d4" transparent opacity={0.7} />
    </mesh>
  );
}

export default function AiBeautificationCanvas() {
  return (
    <div className="w-full h-96 bg-slate-900 rounded-xl overflow-hidden relative">
      <Canvas camera={{ position: [0, 0, 3.5] }}>
        <ambientLight intensity={0.5} />
        <ActiveAiFaceMesh />
      </Canvas>
      <div className="absolute top-4 left-4 bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 px-3 py-1 rounded-full text-xs font-mono">
        AI BEAUTIFICATION ACTIVE
      </div>
    </div>
  );
}



