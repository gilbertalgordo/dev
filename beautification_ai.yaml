    # Benchmark Latency
    start_time = time.time()
    iterations = 100
    for _ in range(iterations):
        _ = server.process_frame_batch(dummy_frame, dummy_mask)
    
    avg_latency = ((time.time() - start_time) / iterations) * 1000
    fps = 1000.0 / avg_latency

    print(f"ONNX Runtime Execution Speed: {avg_latency:.2f} ms/frame ({fps:.1f} FPS)")



