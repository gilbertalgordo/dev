import numpy as np
import cv2
import triton_python_backend_utils as pb_utils

class TritonPythonModel:
    def execute(self, requests):
        responses = []
        for request in requests:
            # 1. Preprocess directly in Python script
            raw_bytes = pb_utils.get_input_tensor_by_name(request, "RAW_IMAGE").as_numpy()
            img_data = np.frombuffer(raw_bytes[0], dtype=np.uint8)
            img = cv2.imdecode(img_data, cv2.IMREAD_COLOR)
            
            img_rgb = cv2.cvtColor(cv2.resize(img, (512, 512)), cv2.COLOR_BGR2RGB)
            preprocessed = (img_rgb.astype(np.float32) / 255.0).transpose(2, 0, 1)[None, ...]

            # 2. Programmatically execute the core ONNX model using BLS
            input_tensor = pb_utils.Tensor("input_image", preprocessed)
            infer_request = pb_utils.InferenceRequest(
                model_name="beautifier",
                requested_output_names=["output_image"],
                inputs=[input_tensor]
            )
            
            # Execute synchronously (or use async_exec)
            infer_response = infer_request.exec()
            
            if infer_response.has_error():
                raise pb_utils.TritonModelException(infer_response.error().message())

            # 3. Postprocess execution output
            raw_output = pb_utils.get_output_tensor_by_name(infer_response, "output_image").as_numpy()
            out_img = raw_output[0].transpose(1, 2, 0)  # Convert CHW -> HWC
            out_img = (np.clip(out_img, 0, 1) * 255).astype(np.uint8)

            final_output = pb_utils.Tensor("BEAUTIFIED_IMAGE", np.expand_dims(out_img, axis=0))
            responses.append(pb_utils.InferenceResponse(output_tensors=[final_output]))

        return responses



