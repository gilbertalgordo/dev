    // 2. Test Hover Interaction
    await userEvent.hover(icon);
    await expect(icon).toHaveClass('hover:scale-125');

    // 3. Test Unhover Interaction
    await userEvent.unhover(icon);

    // 4. Test Keyboard Focus Interaction
    await userEvent.tab();
    await expect(icon).toHaveFocus();

    // 5. Test Keyboard Blur Interaction
    await userEvent.tab();
    await expect(icon).not.toHaveFocus();
  },
};



