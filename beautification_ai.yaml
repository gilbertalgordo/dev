        prev_time = curr_time

        cv2.putText(processed_frame, f"CUDA Accelerated FPS: {fps:.1f}", (20, 40), 
                    cv2.FONT_HERSHEY_SIMPLEX, 0.7, (0, 255, 120), 2)
        
        cv2.imshow("PyTorch CUDA AI Beautifier", processed_frame)
        if cv2.waitKey(1) & 0xFF == ord('q'):
