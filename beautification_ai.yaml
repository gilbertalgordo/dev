import torch
import torch.nn as nn
import torch.nn.functional as F
import onnx
import onnxruntime as ort
import numpy as np

class PyTorchBeautifierGraph(nn.Module):
    """
    Fully-traceable PyTorch Graph combining Bilateral Filtering,
    Soft Boundary Mask Blending, and Exposure Tone Mapping.
    """
    def __init__(self, ksize: int = 7, sigma_color: float = 0.08, sigma_space: float = 2.0):
        super().__init__()
        self.ksize = ksize
        self.pad = ksize // 2
        self.sigma_color = sigma_color
        self.sigma_space = sigma_space

        # Precompute spatial distance kernel weights on initialization
        coords = torch.arange(-self.pad, self.pad + 1, dtype=torch.float32)
        grid_y, grid_x = torch.meshgrid(coords, coords, indexing='ij')
        spatial_dist = grid_x**2 + grid_y**2
        spatial_weights = torch.exp(-spatial_dist / (2 * self.sigma_space**2))
        self.register_buffer("spatial_weights", spatial_weights.view(1, 1, 1, 1, -1))

    def forward(self, input_frame: torch.Tensor, mask_roi: torch.Tensor) -> torch.Tensor:
        """
        Inputs:
            input_frame: (B, 3, H, W) normalized [0, 1] RGB image tensor
            mask_roi:    (B, 1, H, W) normalized [0, 1] soft face boundary mask
        Outputs:
            output_frame: (B, 3, H, W) beautified image tensor
        """
        # 1. Bilateral Smoothing Pass
        padded = F.pad(input_frame, (self.pad, self.pad, self.pad, self.pad), mode='reflect')
        
        # Unfold patches: (B, C, H, W, ksize*ksize)
        patches = padded.unfold(2, self.ksize, 1).unfold(3, self.ksize, 1)
        patches = patches.contiguous().view(
            input_frame.size(0), input_frame.size(1), input_frame.size(2), input_frame.size(3), -1
        )

        # Compute range (color distance) weights against center pixel
        center_pixel = input_frame.unsqueeze(-1)
        color_dist = torch.sum((patches - center_pixel) ** 2, dim=1, keepdim=True)
        color_weights = torch.exp(-color_dist / (2 * self.sigma_color**2))

        # Combined weight normalization
        total_weights = self.spatial_weights * color_weights
        weights_sum = total_weights.sum(dim=-1, keepdim=True)
        smoothed = torch.sum(patches * total_weights, dim=-1) / (weights_sum + 1e-6)

        # 2. Feathered ROI Blending Pass
        feathered_mask = F.avg_pool2d(mask_roi, kernel_size=15, stride=1, padding=7)
        blended = smoothed * feathered_mask + input_frame * (1.0 - feathered_mask)

        # 3. Tone Mapping & Exposure Boost Curve
        graded = (blended - 0.5) * 1.12 + 0.5 + 0.05
        output_frame = torch.clamp(graded, 0.0, 1.0)

        return output_frame


def export_pipeline_to_onnx(output_path: str = "beautifier_engine.onnx"):
    model = PyTorchBeautifierGraph()
    model.eval()

    # Dummy inputs for tracing graph
    dummy_frame = torch.randn(1, 3, 720, 1280, dtype=torch.float32)
    dummy_mask = torch.randn(1, 1, 720, 1280, dtype=torch.float32)

    # Dynamic axes configuration for backend servers (variable resolutions & batch sizes)
    dynamic_axes = {
        'input_frame': {0: 'batch_size', 2: 'height', 3: 'width'},
        'mask_roi': {0: 'batch_size', 2: 'height', 3: 'width'},
        'output_frame': {0: 'batch_size', 2: 'height', 3: 'width'}
    }

    print("Exporting model graph to ONNX...")
    torch.onnx.export(
        model,
        (dummy_frame, dummy_mask),
        output_path,
        export_params=True,
        opset_version=17,
        do_constant_folding=True,
        input_names=['input_frame', 'mask_roi'],
        output_names=['output_frame'],
        dynamic_axes=dynamic_axes
    )

    # Verify exported ONNX model integrity
    onnx_model = onnx.load(output_path)
    onnx.checker.check_model(onnx_model)
    print(f"ONNX Model successfully exported and verified: {output_path}")

if __name__ == "__main__":
    export_pipeline_to_onnx()



import onnxruntime as ort
import numpy as np
import cv2
import time

class ONNXRuntimeBeautifierServer:
    """
    Production ONNX Runtime Engine configured for high-throughput backend servers.
    Supports CUDA, TensorRT, and OpenVINO hardware acceleration providers.
    """
    def __init__(self, model_path: str = "beautifier_engine.onnx"):
        # Configure High-Performance ORT Session Options
        self.opts = ort.SessionOptions()
        self.opts.execution_mode = ort.ExecutionMode.ORT_PARALLEL
        self.opts.graph_optimization_level = ort.GraphOptimizationLevel.ORT_ENABLE_ALL
        self.opts.enable_cpu_mem_arena = True
        self.opts.intra_op_num_threads = 4

        # Hardware Execution Provider Cascade
        providers = [
            ('TensorrtExecutionProvider', {
                'device_id': 0,
                'trt_fp16_enable': True,
                'trt_engine_cache_enable': True,
                'trt_engine_cache_path': './trt_cache'
            }),
            ('CUDAExecutionProvider', {
                'device_id': 0,
                'arena_extend_strategy': 'kNextPowerOfTwo',
                'cudnn_conv_algo_search': 'EXHAUSTIVE',
                'do_copy_in_default_stream': True
            }),
            'CPUExecutionProvider'
        ]

        print(f"Initializing ONNX Runtime Session for: {model_path}")
        self.session = ort.InferenceSession(model_path, self.opts, providers=providers)
        
        # Query input/output metadata
        self.input_names = [inp.name for inp in self.session.get_inputs()]
        self.output_names = [out.name for out in self.session.get_outputs()]
        
        print(f"Active Execution Providers: {self.session.get_providers()}")

    def process_frame_batch(self, frame_bgr: np.ndarray, mask_gray: np.ndarray) -> np.ndarray:
        """
        Executes ONNX Runtime inference pass across incoming numpy arrays.
        """
        h, w, _ = frame_bgr.shape

        # 1. Preprocessing: BGR uint8 -> RGB Float32 NCHW [0, 1]
        rgb = cv2.cvtColor(frame_bgr, cv2.COLOR_BGR2RGB)
        tensor_frame = np.expand_dims(rgb.transpose(2, 0, 1), axis=0).astype(np.float32) / 255.0
        
        tensor_mask = np.expand_dims(mask_gray, axis=(0, 1)).astype(np.float32) / 255.0

        # 2. Bind Inputs & Execute Inference
        inputs = {
            self.input_names[0]: tensor_frame,
            self.input_names[1]: tensor_mask
        }

        outputs = self.session.run(self.output_names, inputs)

        # 3. Postprocessing: NCHW Float32 -> BGR uint8 [0, 255]
        output_tensor = outputs[0][0] # First item in batch
        output_rgb = (output_tensor.transpose(1, 2, 0) * 255.0).clip(0, 255).astype(np.uint8)
        
        return cv2.cvtColor(output_rgb, cv2.COLOR_RGB2BGR)

if __name__ == "__main__":
    # Test ONNX Runtime Server Session
    server = ONNXRuntimeBeautifierServer("beautifier_engine.onnx")

    # Generate test frame and facial mask
    dummy_frame = np.full((720, 1280, 3), 120, dtype=np.uint8)
    dummy_mask = np.full((720, 1280), 255, dtype=np.uint8)

    # Warmup pass
