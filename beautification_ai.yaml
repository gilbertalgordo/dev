import tensorrt as trt
import numpy as np
import cv2
import time
from cuda import cuda, cudart

class TensorRTRunner:
    """
    High-throughput execution wrapper for compiled TensorRT engines.
    Manages pinned host memory buffers, CUDA stream allocation, and async execution.
    """
    def __init__(self, engine_path: str):
        self.logger = trt.Logger(trt.Logger.WARNING)
        self.runtime = trt.Runtime(self.logger)
        
        # 1. Deserialize the compiled TensorRT plan/engine
        print(f"Loading TensorRT Engine from: {engine_path}")
        with open(engine_path, "rb") as f:
            self.engine = self.runtime.deserialize_cuda_engine(f.read())
            
        if self.engine is None:
            raise RuntimeError("Failed to deserialize TensorRT engine file.")

        self.context = self.engine.create_execution_context()
        
        # 2. Create CUDA stream for asynchronous execution
        err, self.stream = cudart.cudaStreamCreate()
        if err != cudart.cudaError_t.cudaSuccess:
            raise RuntimeError(f"CUDA stream creation failed: {err}")

        # 3. Allocate Host and Device buffers
        self.inputs = []
        self.outputs = []
        self.allocations = []
        
        self._allocate_buffers()

    def _allocate_buffers(self):
        """Allocates pinned host memory and CUDA device memory for input and output tensors."""
        num_io_tensors = self.engine.num_io_tensors if hasattr(self.engine, "num_io_tensors") else self.engine.num_bindings
        
        for i in range(num_io_tensors):
            tensor_name = self.engine.get_tensor_name(i) if hasattr(self.engine, "get_tensor_name") else self.engine.get_binding_name(i)
            tensor_shape = self.engine.get_tensor_shape(tensor_name) if hasattr(self.engine, "get_tensor_shape") else self.engine.get_binding_shape(i)
            tensor_dtype = self.engine.get_tensor_dtype(tensor_name) if hasattr(self.engine, "get_tensor_dtype") else self.engine.get_binding_dtype(i)
            
            # Convert TensorRT DataType to numpy dtype
            np_dtype = trt.nptype(tensor_dtype)
            size = trt.volume(tensor_shape) * np_dtype.itemsize
            
            # Allocate pinned host memory and CUDA device buffer
            _, host_mem = cudart.cudaMallocHost(size)
            _, device_mem = cudart.cudaMalloc(size)
            
            binding_info = {
                "name": tensor_name,
                "shape": tensor_shape,
                "dtype": np_dtype,
                "size": size,
                "host": np.frombuffer(host_mem, dtype=np_dtype).reshape(tensor_shape),
                "device": int(device_mem)
            }
            
            self.allocations.append(int(device_mem))
            
            # Set tensor address for execution context (TensorRT 8.5+ API)
            if hasattr(self.context, "set_tensor_address"):
                self.context.set_tensor_address(tensor_name, int(device_mem))
                
            is_input = self.engine.get_tensor_mode(tensor_name) == trt.TensorIOMode.INPUT if hasattr(self.engine, "get_tensor_mode") else self.engine.binding_is_input(i)
            
            if is_input:
                self.inputs.append(binding_info)
            else:
                self.outputs.append(binding_info)

    def infer(self, frame: np.ndarray) -> np.ndarray:
        """
        Executes asynchronous inference pass on incoming BGR frame:
        H2D Copy -> TensorRT Async Execution -> D2H Copy -> Stream Synchronize
        """
        # Preprocessing: BGR -> RGB Float32 (NCHW)
        rgb_frame = cv2.cvtColor(frame, cv2.COLOR_BGR2RGB)
        input_data = np.expand_dims(rgb_frame.transpose(2, 0, 1), axis=0).astype(np.float32) / 255.0

        # Copy input data into pinned host buffer
        np.copyto(self.inputs[0]["host"], input_data)

        # 1. Host to Device Async Copy
        cudart.cudaMemcpyAsync(
            self.inputs[0]["device"],
            self.inputs[0]["host"].ctypes.data,
            self.inputs[0]["size"],
            cudart.cudaMemcpyKind.cudaMemcpyHostToDevice,
            self.stream
        )

        # 2. Execute TensorRT Inference Async
        if hasattr(self.context, "execute_async_v3"):
            self.context.execute_async_v3(stream_handle=self.stream)
        else:
            self.context.execute_async_v2(bindings=self.allocations, stream_handle=self.stream)

        # 3. Device to Host Async Copy
        cudart.cudaMemcpyAsync(
            self.outputs[0]["host"].ctypes.data,
            self.outputs[0]["device"],
            self.outputs[0]["size"],
            cudart.cudaMemcpyKind.cudaMemcpyDeviceToHost,
            self.stream
        )

        # 4. Synchronize stream for completion
        cudart.cudaStreamSynchronize(self.stream)

        # Postprocessing: NCHW float32 -> BGR uint8
        output_tensor = self.outputs[0]["host"][0] # Shape: (C, H, W)
        output_rgb = (output_tensor.transpose(1, 2, 0) * 255.0).clip(0, 255).astype(np.uint8)
        return cv2.cvtColor(output_rgb, cv2.COLOR_RGB2BGR)

    def __del__(self):
        """Free CUDA resources upon object cleanup."""
        if hasattr(self, "stream"):
            cudart.cudaStreamDestroy(self.stream)
        for dev_ptr in self.allocations:
            cudart.cudaFree(dev_ptr)

if __name__ == "__main__":
    # Path to compiled TensorRT plan
    ENGINE_PATH = "beautifier_gpu.engine"

    try:
        runner = TensorRTRunner(ENGINE_PATH)
        cap = cv2.VideoCapture(0)
        cap.set(cv2.CAP_PROP_FRAME_WIDTH, 1280)
        cap.set(cv2.CAP_PROP_FRAME_HEIGHT, 720)

        prev_time = time.time()

        print("Executing TensorRT Beautifier Stream... Press 'q' to exit.")
        while cap.isOpened():
            ret, frame = cap.read()
            if not ret:
                break

            # Execute TRT Inference Pass
            output_frame = runner.infer(cv2.flip(frame, 1))

            # Calculate FPS
            curr_time = time.time()
            fps = 1.0 / (curr_time - prev_time + 1e-6)
            prev_time = curr_time

            cv2.putText(output_frame, f"TensorRT Engine FPS: {fps:.1f}", (20, 40), 
                        cv2.FONT_HERSHEY_SIMPLEX, 0.7, (0, 255, 120), 2)

            cv2.imshow("TensorRT AI Beautifier", output_frame)
            if cv2.waitKey(1) & 0xFF == ord('q'):
                break

        cap.release()
        cv2.destroyAllWindows()

    except Exception as e:
        print(f"Error during execution: {e}")




