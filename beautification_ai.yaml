<body>

  <h1>Active AI Beautification Stream</h1>
  <div class="controls">
    <button id="startBtn">Start Stream</button>
    <button id="stopBtn" disabled>Stop Stream</button>
    <span id="status" class="status">Status: Disconnected</span>
  </div>

  <div class="video-container">
    <div>
      <h3>Raw Camera Feed</h3>
      <video id="inputVideo" autoplay playsinline muted></video>
    </div>
    <div>
      <h3>AI Beautified Output</h3>
      <img id="outputFrame" alt="AI Output Feed" />
    </div>
  </div>

  <script>
    const WS_URL = "ws://localhost:8000/ws/v1/stream";
    const TARGET_FPS = 30;

    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const statusEl = document.getElementById("status");
    const videoEl = document.getElementById("inputVideo");
    const outputImg = document.getElementById("outputFrame");

    let socket = null;
    let stream = null;
    let captureInterval = null;
    let canvas = document.createElement("canvas");
    let ctx = canvas.getContext("2d");

    // Start streaming webcam feed
    async function startStreaming() {
      try {
        // Request browser webcam access
        stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 1280, height: 720, frameRate: { ideal: TARGET_FPS } },
          audio: false
        });
        videoEl.srcObject = stream;

        // Initialize WebSocket connection
        socket = new WebSocket(WS_URL);
        socket.binaryType = "arraybuffer";

        socket.onopen = () => {
          statusEl.textContent = "Status: Connected & Streaming";
          startBtn.disabled = true;
          stopBtn.disabled = false;

          // Set canvas dimensions to match video stream dimensions
          canvas.width = 1280;
          canvas.height = 720;

          // Loop frame capture at fixed interval
          captureInterval = setInterval(() => {
            if (socket.readyState === WebSocket.OPEN) {
              // Draw current video frame onto offscreen canvas
              ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);

              // Convert canvas frame to JPEG Blob and send as binary ArrayBuffer
              canvas.toBlob(async (blob) => {
                if (blob && socket.readyState === WebSocket.OPEN) {
                  const buffer = await blob.arrayBuffer();
                  socket.send(buffer);
                }
              }, "image/jpeg", 0.85); // 85% compression quality
            }
          }, 1000 / TARGET_FPS);
        };

        // Handle receiving beautified frame from FastAPI server
        socket.onmessage = (event) => {
          const blob = new Blob([event.data], { type: "image/jpeg" });
          const url = URL.createObjectURL(blob);
          
          // Free memory from previous Blob object URL
          if (outputImg.src) {
            URL.revokeObjectURL(outputImg.src);
          }
          outputImg.src = url;
        };

        socket.onclose = () => {
          stopStreaming();
          statusEl.textContent = "Status: Disconnected";
        };

        socket.onerror = (err) => {
          console.error("WebSocket Error:", err);
          statusEl.textContent = "Status: Connection Error";
        };

      } catch (err) {
        console.error("Error accessing camera:", err);
        alert("Could not access camera. Please check permissions.");
      }
    }

    // Stop stream and release hardware/socket resources
    function stopStreaming() {
      if (captureInterval) clearInterval(captureInterval);
      if (stream) stream.getTracks().forEach(track => track.stop());
      if (socket && socket.readyState === WebSocket.OPEN) socket.close();

      startBtn.disabled = false;
      stopBtn.disabled = true;
      statusEl.textContent = "Status: Stopped";
    }

    startBtn.addEventListener("click", startStreaming);
    stopBtn.addEventListener("click", stopStreaming);
  </script>
</body>
