import numpy as np
import cv2
import triton_python_backend_utils as pb_utils

class TritonPythonModel:
    def execute(self, requests):
        responses = []
        for request in requests:
            # 1. Extract raw JPEG/PNG bytes (BYTES/TYPE_STRING)
            raw_bytes_tensor = pb_utils.get_input_tensor_by_name(request, "RAW_IMAGE")
            bytes_array = raw_bytes_tensor.as_numpy()

            processed_images = []
            for img_bytes in bytes_array:
                # Decode image
                img_data = np.frombuffer(img_bytes, dtype=np.uint8)
                img = cv2.imdecode(img_data, cv2.IMREAD_COLOR)  # HWC, BGR
                
                # Resize to target dimension (512x512) and convert to RGB
                img = cv2.resize(img, (512, 512))
                img = cv2.cvtColor(img, cv2.COLOR_BGR2RGB)
                
                # Normalize [0, 1] and transpose to CHW format
                img = (img.astype(np.float32) / 255.0).transpose(2, 0, 1)
                processed_images.append(img)

            # Package output tensor
            output_tensor = pb_utils.Tensor(
                "PREPROCESSED_IMAGE", np.array(processed_images, dtype=np.float32)
            )
            responses.append(pb_utils.InferenceResponse(output_tensors=[output_tensor]))

        return responses



