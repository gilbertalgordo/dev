import cv2
import numpy as np
import mediapipe as mp
import time

class AdvancedAIBeautifier:
    """
    Advanced Active AI Beautification Engine
    Integrates 3D landmark skin ROI isolation, bilateral domain filtering,
    iris/eye enhancement, and HUD performance telemetry.
    """
    # MediaPipe Face Mesh landmark region indices
    FACE_OVAL = [10, 338, 297, 332, 284, 251, 389, 356, 454, 323, 361, 288, 397, 365, 379, 378, 400, 377, 152, 148, 176, 149, 150, 136, 172, 58, 132, 93, 234, 127, 162, 21, 54, 103, 67, 109]
    LEFT_EYE = [362, 382, 381, 380, 374, 373, 390, 249, 263, 466, 388, 387, 386, 385, 384, 398]
    RIGHT_EYE = [33, 7, 163, 144, 145, 153, 154, 155, 133, 173, 157, 158, 159, 160, 161, 246]

    def __init__(self, smoothing_radius=9, color_sigma=75, space_sigma=75, boost_brightness=1.12):
        self.smoothing_radius = smoothing_radius
        self.color_sigma = color_sigma
        self.space_sigma = space_sigma
        self.boost_brightness = boost_brightness
        
        self.mp_face_mesh = mp.solutions.face_mesh
        self.face_mesh = self.mp_face_mesh.FaceMesh(
            static_image_mode=False,
            max_num_faces=1,
            refine_landmarks=True,
            min_detection_confidence=0.7,
            min_tracking_confidence=0.7
        )
        self.fps_counter = 0
        self.last_time = time.time()
        self.current_fps = 0.0

    def generate_face_mask(self, shape: tuple, landmarks, img_w: int, img_h: int) -> np.ndarray:
        """Constructs an anti-aliased convex mask around the detected facial boundary, excluding eyes."""
        mask = np.zeros((shape[0], shape[1]), dtype=np.uint8)
        
        # Outer facial contour
        face_pts = np.array([[int(landmarks[idx].x * img_w), int(landmarks[idx].y * img_h)] for idx in self.FACE_OVAL], dtype=np.int32)
        cv2.fillConvexPoly(mask, face_pts, 255)

        # Exclude eye regions to preserve sharpness
        left_eye_pts = np.array([[int(landmarks[idx].x * img_w), int(landmarks[idx].y * img_h)] for idx in self.LEFT_EYE], dtype=np.int32)
        right_eye_pts = np.array([[int(landmarks[idx].x * img_w), int(landmarks[idx].y * img_h)] for idx in self.RIGHT_EYE], dtype=np.int32)
        
        cv2.fillPoly(mask, [left_eye_pts], 0)
        cv2.fillPoly(mask, [right_eye_pts], 0)

        # Soften mask edges via Gaussian blur for smooth blending
        return cv2.GaussianBlur(mask, (15, 15), 10)

    def enhance_eyes(self, frame: np.ndarray, landmarks, img_w: int, img_h: int) -> np.ndarray:
        """Applies local contrast enhancement specifically to the eye regions."""
        eye_mask = np.zeros(frame.shape[:2], dtype=np.uint8)
        left_pts = np.array([[int(landmarks[idx].x * img_w), int(landmarks[idx].y * img_h)] for idx in self.LEFT_EYE], dtype=np.int32)
        right_pts = np.array([[int(landmarks[idx].x * img_w), int(landmarks[idx].y * img_h)] for idx in self.RIGHT_EYE], dtype=np.int32)
        
        cv2.fillPoly(eye_mask, [left_pts, right_pts], 255)
        
        # Increase sharpness and contrast locally
        lab = cv2.cvtColor(frame, cv2.COLOR_BGR2LAB)
        l, a, b = cv2.split(lab)
        clahe = cv2.createCLAHE(clipLimit=3.0, tileGridSize=(4, 4))
        l_enhanced = clahe.apply(l)
        
        enhanced_bgr = cv2.cvtColor(cv2.merge((l_enhanced, a, b)), cv2.COLOR_LAB2BGR)
        
        # Blend eye enhancement using the eye mask
        alpha = (eye_mask / 255.0)[:, :, np.newaxis]
        return (enhanced_bgr * alpha + frame * (1 - alpha)).astype(np.uint8)

    def process_frame(self, frame: np.ndarray) -> np.ndarray:
        h, w, c = frame.shape
        rgb_frame = cv2.cvtColor(frame, cv2.COLOR_BGR2RGB)
        results = self.face_mesh.process(rgb_frame)

        # Base Bilateral Filter pass
        smoothed = cv2.bilateralFilter(
            frame, 
            d=self.smoothing_radius, 
            sigmaColor=self.color_sigma, 
            sigmaSpace=self.space_sigma
        )

        if results.multi_face_landmarks:
            landmarks = results.multi_face_landmarks[0].landmark
            
            # Generate soft facial mask
            mask = self.generate_face_mask((h, w), landmarks, w, h)
            alpha = (mask / 255.0)[:, :, np.newaxis]

            # Blend smoothed skin onto original frame
            blended = (smoothed * alpha + frame * (1 - alpha)).astype(np.uint8)

            # Eye enhancement pass
            processed = self.enhance_eyes(blended, landmarks, w, h)
        else:
            processed = smoothed

        # Global Exposure & Tone Balance
        processed = cv2.convertScaleAbs(processed, alpha=self.boost_brightness, beta=2)

        # Performance calculations
        self.fps_counter += 1
        now = time.time()
        if now - self.last_time >= 1.0:
            self.current_fps = self.fps_counter / (now - self.last_time)
            self.fps_counter = 0
            self.last_time = now

        # Draw HUD Telemetry Overlay
        self._render_hud(processed)

        return processed

    def _render_hud(self, img: np.ndarray):
        """Renders HUD metrics on screen."""
        cv2.rectangle(img, (15, 15), (420, 75), (15, 23, 42), -1)
        cv2.rectangle(img, (15, 15), (420, 75), (0, 255, 150), 1)
        
        cv2.putText(img, "ACTIVE AI BEAUTIFICATION ENGINE", (25, 35), 
                    cv2.FONT_HERSHEY_SIMPLEX, 0.5, (0, 255, 150), 1, cv2.LINE_AA)
        cv2.putText(img, f"FPS: {self.current_fps:.1f} | g.dev/gilbert_algordo", (25, 60), 
                    cv2.FONT_HERSHEY_SIMPLEX, 0.45, (220, 220, 220), 1, cv2.LINE_AA)

if __name__ == "__main__":
    cap = cv2.VideoCapture(0)
    beautifier = AdvancedAIBeautifier()

    while cap.isOpened():
        ret, frame = cap.read()
        if not ret:
            break
        
        output = beautifier.process_frame(cv2.flip(frame, 1))
        cv2.imshow("Advanced AI Beautifier", output)

        if cv2.waitKey(1) & 0xFF == ord('q'):
            break

    cap.release()
    cv2.destroyAllWindows()




import torch
import torch.nn as nn
import torch.nn.functional as F
import cv2
import numpy as np
import mediapipe as mp
import time

class CUDABeautifierEngine(nn.Module):
    """
    High-Performance GPU AI Beautification Engine.
    Executes Bilateral Filtering, Face Masking, and Tone Grading directly on CUDA tensors.
    Designed to work alongside TensorRT/MediaPipe pipelines.
    """
    def __init__(self, device: str = "cuda"):
        super().__init__()
        self.device = torch.device(device if torch.cuda.is_available() else "cpu")
        print(f"Executing AI Pipeline on Device: {self.device}")

        # MediaPipe Face Mesh initialization for ROI landmarks
        self.mp_face_mesh = mp.solutions.face_mesh
        self.face_mesh = self.mp_face_mesh.FaceMesh(
            static_image_mode=False,
            max_num_faces=1,
            refine_landmarks=True,
            min_detection_confidence=0.7,
            min_tracking_confidence=0.7
        )

        # Facial indices for masking
        self.FACE_OVAL = [10, 338, 297, 332, 284, 251, 389, 356, 454, 323, 361, 288, 397, 365, 379, 378, 400, 377, 152, 148, 176, 149, 150, 136, 172, 58, 132, 93, 234, 127, 162, 21, 54, 103, 67, 109]
        self.LEFT_EYE = [362, 382, 381, 380, 374, 373, 390, 249, 263, 466, 388, 387, 386, 385, 384, 398]
        self.RIGHT_EYE = [33, 7, 163, 144, 145, 153, 154, 155, 133, 173, 157, 158, 159, 160, 161, 246]

    def gpu_bilateral_filter(self, tensor: torch.Tensor, ksize: int = 9, sigma_color: float = 0.1, sigma_space: float = 1.5) -> torch.Tensor:
        """
        Fast GPU approximation of Bilateral Filter using vectorized spatial and color distance kernels.
        Input: Tensor shape (B, C, H, W) normalized [0, 1] on CUDA device.
        """
        pad = ksize // 2
        padded = F.pad(tensor, (pad, pad, pad, pad), mode='reflect')
        
        # Unfold spatial neighborhood: (B, C, H, W, ksize*ksize)
        patches = padded.unfold(2, ksize, 1).unfold(3, ksize, 1)
        patches = patches.contiguous().view(tensor.size(0), tensor.size(1), tensor.size(2), tensor.size(3), -1)

        # Compute spatial weights
        coords = torch.arange(-pad, pad + 1, device=self.device, dtype=torch.float32)
        grid_y, grid_x = torch.meshgrid(coords, coords, indexing='ij')
        spatial_dist = grid_x**2 + grid_y**2
        spatial_weights = torch.exp(-spatial_dist / (2 * sigma_space**2)).view(1, 1, 1, 1, -1)

        # Compute range (color) weights against center pixel
        center_pixel = tensor.unsqueeze(-1)
        color_dist = torch.sum((patches - center_pixel) ** 2, dim=1, keepdim=True)
        color_weights = torch.exp(-color_dist / (2 * sigma_color**2))

        # Combined weights normalization
        total_weights = spatial_weights * color_weights
        weights_sum = total_weights.sum(dim=-1, keepdim=True)
        
        filtered = torch.sum(patches * total_weights, dim=-1) / (weights_sum + 1e-6)
        return filtered

    def gpu_tone_grading(self, tensor: torch.Tensor, brightness: float = 1.08, contrast: float = 1.12) -> torch.Tensor:
        """Vectorized GPU exposure curve and soft contrast adjustment."""
        # Mean luminance contrast adjustment around midtones (0.5)
        graded = (tensor - 0.5) * contrast + 0.5 + (brightness - 1.0)
        return torch.clamp(graded, 0.0, 1.0)

    @torch.inference_mode()
    def forward(self, frame_bgr: np.ndarray) -> np.ndarray:
        h, w, c = frame_bgr.shape

        # Step 1: Upload CPU Frame to GPU Tensor (NCHW, Float32, [0, 1])
        rgb_input = cv2.cvtColor(frame_bgr, cv2.COLOR_BGR2RGB)
        tensor_gpu = torch.from_numpy(rgb_input).to(self.device).permute(2, 0, 1).unsqueeze(0).float() / 255.0

        # Step 2: Parallel MediaPipe Landmark Extraction
        results = self.face_mesh.process(rgb_input)

        # Step 3: Run GPU Bilateral Smoothing Kernel
        smoothed_gpu = self.gpu_bilateral_filter(tensor_gpu, ksize=7, sigma_color=0.08, sigma_space=2.0)

        # Step 4: Generate Face ROI Soft Mask on GPU
        if results.multi_face_landmarks:
            landmarks = results.multi_face_landmarks[0].landmark
            
            # Construct CPU Polygon Mask
            mask_cpu = np.zeros((h, w), dtype=np.float32)
            face_pts = np.array([[int(landmarks[idx].x * w), int(landmarks[idx].y * h)] for idx in self.FACE_OVAL], dtype=np.int32)
            cv2.fillConvexPoly(mask_cpu, face_pts, 1.0)

            # Subtract eye regions
            left_eye_pts = np.array([[int(landmarks[idx].x * w), int(landmarks[idx].y * h)] for idx in self.LEFT_EYE], dtype=np.int32)
            right_eye_pts = np.array([[int(landmarks[idx].x * w), int(landmarks[idx].y * h)] for idx in self.RIGHT_EYE], dtype=np.int32)
            cv2.fillPoly(mask_cpu, [left_eye_pts, right_eye_pts], 0.0)

            # Upload Mask to GPU and smooth with Gaussian blur tensor
            mask_gpu = torch.from_numpy(mask_cpu).to(self.device).unsqueeze(0).unsqueeze(0)
            mask_gpu = F.avg_pool2d(mask_gpu, kernel_size=15, stride=1, padding=7) # Fast GPU soft feathering

            # Blend smoothed skin with original image via GPU alpha composite
            blended_gpu = smoothed_gpu * mask_gpu + tensor_gpu * (1.0 - mask_gpu)
        else:
            blended_gpu = smoothed_gpu

        # Step 5: GPU Tone Grading
        final_gpu = self.gpu_tone_grading(blended_gpu, brightness=1.05, contrast=1.1)

        # Step 6: Convert CUDA Tensor back to BGR numpy array for display
        output_rgb = (final_gpu.squeeze(0).permute(1, 2, 0).cpu().numpy() * 255.0).clip(0, 255).astype(np.uint8)
        return cv2.cvtColor(output_rgb, cv2.COLOR_RGB2BGR)

