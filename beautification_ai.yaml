import sys
import gi
gi.require_version('Gst', '1.0')
from gi.repository import Gst, GLib

def create_element(factory_name, element_name):
    element = Gst.ElementFactory.make(factory_name, element_name)
    if not element:
        sys.stderr.write(f" Error: Failed to create element '{element_name}' ({factory_name})\n")
        sys.exit(1)
    return element

def main(stream_uris):
    Gst.init(None)
    pipeline = Gst.Pipeline.new("ds-multi-camera-pipeline")
    num_sources = len(stream_uris)

    # 1. Create Core Pipeline Elements
    streammux = create_element("nvstreammux", "stream-muxer")
    pgie = create_element("nvinfer", "primary-nvinfer-engine")
    tiler = create_element("nvmultiostreamtiler", "nv-tiler")
    converter = create_element("nvvideoconvert", "nv-converter")
    osd = create_element("nvdsosd", "nv-osd")
    sink = create_element("nveglglessink", "nv-egl-sink")

    # Configure Stream Multiplexer (NVMM Batching)
    streammux.set_property('width', 1280)
    streammux.set_property('height', 720)
    streammux.set_property('batch-size', num_sources)
    streammux.set_property('batched-push-timeout', 40000)

    # Configure TensorRT Inference Plugin
    pgie.set_property('config-file-path', 'config_infer.txt')

    # Configure Multi-Stream Grid Visualizer
    tiler.set_property('rows', 2)
    tiler.set_property('columns', 2)
    tiler.set_property('width', 1920)
    tiler.set_property('height', 1080)

    pipeline.add(streammux)
    pipeline.add(pgie)
    pipeline.add(tiler)
    pipeline.add(converter)
    pipeline.add(osd)
    pipeline.add(sink)

    # 2. Dynamically attach camera sources (RTSP/File) via nvurisrcbin
    for i, uri in enumerate(stream_uris):
        source_bin = create_element("nvurisrcbin", f"src-bin-{i}")
        source_bin.set_property("uri", uri)
        pipeline.add(source_bin)

        # Link source pad to streammux sink pad
        sinkpad = streammux.get_request_pad(f"sink_{i}")
        
        def cb_pad_added(pad_added_elem, pad, target_sinkpad):
            caps = pad.get_current_caps()
            if caps and caps.get_structure(0).get_name().startswith("video"):
                pad.link(target_sinkpad)

        source_bin.connect("pad-added", cb_pad_added, sinkpad)

    # 3. Link rest of DeepStream pipeline elements
    streammux.link(pgie)
    pgie.link(tiler)
    tiler.link(converter)
    converter.link(osd)
    osd.link(sink)

    # 4. Start Event Loop & Pipeline Execution
    loop = GLib.MainLoop()
    bus = pipeline.get_bus()
    bus.add_signal_watch()

    def on_bus_message(bus, message):
        t = message.type
        if t == Gst.MessageType.EOS:
            print("End-of-stream reached.")
            loop.quit()
        elif t == Gst.MessageType.ERROR:
            err, debug = message.parse_error()
            print(f"Pipeline Error: {err}, {debug}")
            loop.quit()
        return True

    bus.connect("message", on_bus_message)
    pipeline.set_state(Gst.State.PLAYING)
    print(f"DeepStream Pipeline Running across {num_sources} Streams...")

    try:
        loop.run()
    except Exception:
        pass
    finally:
        pipeline.set_state(Gst.State.NULL)

if __name__ == "__main__":
    # Multi-camera stream endpoints (RTSP/Files)
    CAMERAS = [
        "rtsp://192.168.1.101:554/stream1",
        "rtsp://192.168.1.102:554/stream1",
        "file:///absolute/path/to/test_video.mp4"
    ]
    main(CAMERAS)




