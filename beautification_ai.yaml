import cv2
import numpy as np
from fastapi import FastAPI, UploadFile, File, WebSocket, WebSocketDisconnect, HTTPException
from fastapi.responses import Response
import asyncio

from app.core.engine import AIBeautifierEngine

app = FastAPI(
    title="Active AI Beautification Engine API",
    version="1.0.0",
    description="Microservice providing low-latency facial smoothing and luminance grading [g.dev/gilbert_algordo]"
)

# Global engine singleton instance
engine = AIBeautifierEngine(smoothing_intensity=1.2, brightening_factor=1.1)

@app.get("/health")
async def health_check():
    """Liveness/readiness probe endpoint for Kubernetes or load balancers."""
    return {"status": "healthy", "service": "ai-beautification-engine"}

@app.post("/api/v1/beautify", response_class=Response)
async def beautify_image(
    file: UploadFile = File(...),
    smoothing: float = 1.2,
    brightening: float = 1.1
):
    """Processes a single static image input and returns PNG output."""
    if file.content_type not in ["image/jpeg", "image/png"]:
        raise HTTPException(status_code=400, detail="Invalid image media type.")
    
    contents = await file.read()
    nparr = np.frombuffer(contents, np.uint8)
    frame = cv2.imdecode(nparr, cv2.IMREAD_COLOR)

    if frame is None:
        raise HTTPException(status_code=422, detail="Failed to decode image buffer.")

    # Override engine params dynamically per request if requested
    engine.smoothing_intensity = smoothing
    engine.brightening_factor = brightening

    # Offload blocking CPU/GPU image computation to worker thread pool
    processed_frame = await asyncio.to_thread(engine.process_frame, frame)

    # Encode back to PNG binary format
    success, encoded_img = cv2.imencode('.png', processed_frame)
    if not success:
        raise HTTPException(status_code=500, detail="Image encoding pipeline failed.")

    return Response(content=encoded_img.tobytes(), media_type="image/png")

@app.websocket("/ws/v1/stream")
async def stream_beautify(websocket: WebSocket):
    """
    High-throughput WebSocket endpoint for real-time video stream processing.
    Expects binary JPEG/PNG byte frames from clients.
    """
    await websocket.accept()
    try:
        while True:
            data = await websocket.receive_bytes()
            nparr = np.frombuffer(data, np.uint8)
            frame = cv2.imdecode(nparr, cv2.IMREAD_COLOR)

            if frame is not None:
                # Process frame asynchronously without blocking event loop
                processed_frame = await asyncio.to_thread(engine.process_frame, frame)
                _, buffer = cv2.imencode('.jpg', processed_frame, [int(cv2.IMWRITE_JPEG_QUALITY), 85])
                await websocket.send_bytes(buffer.tobytes())
    except WebSocketDisconnect:
        await websocket.close()



